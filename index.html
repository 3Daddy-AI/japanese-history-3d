<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本の歴史 3Dシミュレーション</title>
<style>
  :root{
    --panel-bg: rgba(20,18,24,.82);
    --accent:#e8b84b;
    --text:#f2ede2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #title{position:fixed;top:14px;left:18px;z-index:10;pointer-events:none;
    text-shadow:0 2px 8px rgba(0,0,0,.7)}
  #title h1{font-size:20px;font-weight:700;letter-spacing:.06em}
  #title p{font-size:11px;opacity:.85;margin-top:2px}

  #eraBanner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;
    text-align:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  #eraBanner .era-name{font-size:34px;font-weight:800;letter-spacing:.15em;color:var(--accent)}
  #eraBanner .era-years{font-size:13px;opacity:.9;margin-top:2px}
  #eraBanner .era-year-now{font-size:15px;margin-top:2px;font-weight:700}

  #info{position:fixed;top:70px;right:14px;width:320px;max-height:calc(100% - 200px);
    overflow-y:auto;background:var(--panel-bg);border:1px solid rgba(232,184,75,.35);
    border-radius:10px;padding:14px 16px;z-index:10;backdrop-filter:blur(6px);font-size:12.5px;line-height:1.65}
  #info h2{font-size:15px;color:var(--accent);margin-bottom:6px}
  #info h3{font-size:12px;color:var(--accent);margin:10px 0 3px;border-bottom:1px solid rgba(232,184,75,.3);padding-bottom:2px}
  #info ul{list-style:none}
  #info li{padding-left:1em;text-indent:-1em}
  #info li::before{content:"・"}
  #info .pop{margin-top:10px;font-size:11.5px;opacity:.85}
  #infoToggle{position:fixed;top:70px;right:14px;z-index:11;display:none;
    background:var(--panel-bg);border:1px solid rgba(232,184,75,.35);color:var(--text);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}

  #controls{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:10;
    width:min(940px,94vw);background:var(--panel-bg);border:1px solid rgba(232,184,75,.35);
    border-radius:12px;padding:10px 16px;backdrop-filter:blur(6px)}
  #eraButtons{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px}
  #eraButtons button{background:rgba(255,255,255,.08);border:1px solid transparent;color:var(--text);
    font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
  #eraButtons button:hover{background:rgba(232,184,75,.25)}
  #eraButtons button.active{background:var(--accent);color:#1c1710;font-weight:700}
  #timelineRow{display:flex;align-items:center;gap:10px}
  #playBtn{background:var(--accent);color:#1c1710;border:none;border-radius:8px;
    padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;min-width:82px}
  #slider{flex:1;accent-color:var(--accent)}
  #tourBtn,#todBtn,#sndBtn,#langBtn,#rubyBtn{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.25);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
  #tourBtn.active,#rubyBtn.active{background:var(--accent);color:#1c1710;font-weight:700}
  ruby rt{font-size:.55em;color:var(--accent);letter-spacing:0}
  @media (max-width: 760px){
    #eraButtons{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    #eraButtons button{flex:0 0 auto;padding:7px 12px;font-size:12px}
    #playBtn,#tourBtn,#todBtn,#sndBtn,#langBtn{padding:8px 12px}
    #subtitle{font-size:13px;padding:6px 12px;max-width:94vw}
  }
  #speed{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.2);
    border-radius:6px;font-size:11px;padding:3px}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
  #subtitle{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;z-index:9;
    max-width:min(860px,90vw);background:rgba(0,0,0,.62);border-radius:8px;padding:8px 20px;
    font-size:15px;line-height:1.55;text-align:center;text-shadow:0 1px 3px #000;
    transition:opacity .4s;pointer-events:none}
  #subtitle .tag{color:var(--accent);font-weight:700;margin-right:.4em}
  #ticker{position:fixed;top:110px;left:18px;z-index:9;max-width:min(360px,46vw);pointer-events:none;font-size:12.5px}
  .tick-line{background:rgba(0,0,0,.5);border-left:3px solid var(--accent);padding:3px 10px;margin-top:4px;
    border-radius:0 6px 6px 0;text-shadow:0 1px 3px #000;animation:tickin .4s}
  @keyframes tickin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @media (max-width: 760px){ #ticker{display:none} }
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0a10;z-index:20;font-size:14px;letter-spacing:.2em}
</style>
</head>
<body>
<div id="app"></div>
<div id="fade"></div>
<div id="loading">日本の歴史を読み込み中…</div>

<script>
  // 読み込みが異常に長い場合のフォールバック表示（CDN遅延・拡張機能によるブロック等の対策）
  (function(){
    var shown = false;
    function showFallback(detail){
      if (shown) return;
      var el = document.getElementById('loading');
      if (!el || el.style.display === 'none') return;
      shown = true;
      el.innerHTML =
        '<div style="max-width:520px;padding:0 24px;text-align:center;line-height:1.8">' +
        '<div style="font-size:16px;margin-bottom:12px">読み込みに時間がかかっています</div>' +
        '<div style="font-size:12px;opacity:.8">3Dライブラリ（Three.js）の読み込みがブロックされているか、通信が不安定な可能性があります。<br>' +
        '広告ブロッカー／拡張機能を一時的にオフにするか、別のブラウザで再度お試しください。</div>' +
        '<div style="font-size:11px;opacity:.5;margin-top:10px">' + (detail || '') + '</div>' +
        '<button onclick="location.reload()" style="margin-top:18px;padding:8px 20px;font-size:13px;' +
        'background:#e8b84b;color:#1c1710;border:none;border-radius:8px;cursor:pointer;font-weight:700">再読み込み</button>' +
        '</div>';
    }
    window.addEventListener('error', function(e){
      showFallback(e && e.message ? e.message : '');
    });
    window.addEventListener('unhandledrejection', function(e){
      showFallback(e && e.reason ? String(e.reason) : '');
    });
    setTimeout(function(){ showFallback('タイムアウト'); }, 12000);
  })();
</script>

<div id="title">
  <h1>日本の歴史 3Dシミュレーション</h1>
  <p>縄文時代（約16,000年前）→ 令和8年（2026）｜生活・産業・戦い</p>
</div>

<div id="eraBanner">
  <div class="era-name"></div>
  <div class="era-years"></div>
  <div class="era-year-now"></div>
</div>

<div id="ticker"></div>
<button id="infoToggle">解説を表示</button>
<div id="info"></div>

<div id="subtitle"></div>

<div id="controls">
  <div id="eraButtons"></div>
  <div id="timelineRow">
    <button id="playBtn">▶ 再生</button>
    <button id="tourBtn" title="時代の見どころをカメラが自動巡回">🎥 ツアー</button>
    <button id="todBtn" title="時間帯を切り替え（昼・夕・夜）">☀️</button>
    <button id="sndBtn" title="環境音のオン/オフ">🔇</button>
    <button id="langBtn" title="Switch language">EN</button>
    <button id="rubyBtn" title="ふりがなを表示（子ども向け）">ふりがな</button>
    <input id="slider" type="range" min="0" max="1499" value="0" step="1">
    <select id="speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   基盤: レンダラ / シーン / カメラ
============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 3000);
camera.position.set(60, 42, 90);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 15;
controls.maxDistance = 400;

const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(80, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = 160;
sun.shadow.camera.left=-S; sun.shadow.camera.right=S;
sun.shadow.camera.top=S;  sun.shadow.camera.bottom=-S;
sun.shadow.camera.far=500;
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   ヘルパー: マテリアル / 基本形状 / 人物 / 木 / 火 / 煙
============================================================ */
const matCache = new Map();
function M(color, opts={}){
  const key = color + JSON.stringify(opts);
  if(!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial({ color, ...opts }));
  return matCache.get(key);
}
function box(g, w,h,d, color, x,y,z, ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(color));
  m.position.set(x, y??h/2, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function cyl(g, rt,rb,h, color, x,y,z, seg=10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), M(color));
  m.position.set(x, y??h/2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function cone(g, r,h, color, x,y,z, seg=10){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), M(color));
  m.position.set(x, y??h/2, z); m.castShadow = m.receiveShadow = true; g.add(m); return m;
}
function sph(g, r, color, x,y,z){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,10,8), M(color));
  m.position.set(x,y,z); m.castShadow = true; g.add(m); return m;
}

let animated = [];   // {update(t,dt)}
function anim(fn){ animated.push(fn); }

/* 人物（歩行アニメーション付き） */
function person(g, clothColor, x, z, opts={}){
  const p = new THREE.Group();
  const body = cyl(p, .45,.55,1.5, clothColor, 0,1.15,0, 8);
  sph(p, .38, 0xe8c39e, 0, 2.25, 0);                    // 頭
  if(opts.hat==='kasa') cone(p, .55,.3, 0xc9a86a, 0, 2.62, 0);
  if(opts.hat==='kabuto') cone(p, .42,.45, 0x333340, 0, 2.62, 0);
  if(opts.spear){ const s=cyl(p,.04,.04,3.4,0x8a6b45,.5,1.7,0); s.castShadow=false; }
  p.position.set(x, 0, z);
  g.add(p);
  const r = opts.radius ?? 0;
  const speed = opts.speed ?? (0.3 + Math.random()*0.5);
  const phase = Math.random()*Math.PI*2;
  anim((t)=>{
    if(r>0){
      const a = phase + t*speed*0.3;
      p.position.x = x + Math.cos(a)*r;
      p.position.z = z + Math.sin(a)*r;
      p.rotation.y = -a;
    }
    p.position.y = Math.abs(Math.sin(t*4*speed + phase))*0.12;  // 歩行の上下動
    body.rotation.z = Math.sin(t*4*speed + phase)*0.06;
  });
  return p;
}

function tree(g, x, z, type='broad', s=1){
  if(type==='pine'){
    cyl(g, .18*s,.25*s, 2.4*s, 0x6b4a2e, x, undefined, z, 6);
    cone(g, 1.5*s, 2.4*s, 0x2e5e34, x, 3.3*s, z, 8);
    cone(g, 1.1*s, 1.9*s, 0x35703c, x, 4.6*s, z, 8);
  } else {
    cyl(g, .2*s,.28*s, 2.2*s, 0x7a5230, x, undefined, z, 6);
    sph(g, 1.6*s, 0x3f7a3a, x, 3.4*s, z);
  }
}

function fire(g, x, z, scale=1){
  const light = new THREE.PointLight(0xff7722, 2.2*scale, 20*scale);
  light.position.set(x, 1.2*scale, z);
  g.add(light);
  const flame = cone(g, .5*scale, 1.4*scale, 0xff6a1a, x, .7*scale, z, 6);
  flame.material = new THREE.MeshBasicMaterial({ color:0xff7a20 });
  anim((t)=>{
    const f = 1 + Math.sin(t*11)*0.25 + Math.sin(t*23)*0.12;
    flame.scale.set(f, f, f);
    light.intensity = (2 + Math.sin(t*13)*0.7)*scale;
  });
}

function smoke(g, x, y, z, rate=1){
  const puffs = [];
  const mat = new THREE.MeshBasicMaterial({ color:0xbbbbbb, transparent:true, opacity:.3, depthWrite:false });
  for(let i=0;i<5;i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(.5,6,5), mat.clone());
    p.position.set(x,y,z); g.add(p); puffs.push({m:p, o:i/5});
  }
  anim((t)=>{
    for(const {m,o} of puffs){
      const k = ((t*0.25*rate + o) % 1);
      m.position.set(x + Math.sin((k*7)+x)*1.2*k, y + k*9, z);
      m.scale.setScalar(.5 + k*2.2);
      m.material.opacity = .38*(1-k);
    }
  });
}

function flagPole(g, x, z, color, h=5){
  cyl(g, .06,.06, h, 0x5a4632, x, undefined, z, 6);
  const f = box(g, 1.6, 1.0, .06, color, x+.85, h-0.8, z);
  anim((t)=>{ f.rotation.y = Math.sin(t*3 + x)*0.25; });
}

/* 水田・水面 */
function water(g, w, d, x, z, color=0x3f6f8a){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M(color, {transparent:true, opacity:.85}));
  m.rotation.x = -Math.PI/2; m.position.set(x, .06, z);
  m.receiveShadow = true; g.add(m);
  anim((t)=>{ m.position.y = .06 + Math.sin(t*1.5 + x)*0.015; });
  return m;
}

function paddy(g, x, z, w=8, d=6){
  water(g, w, d, x, z, 0x4a7d5f);
  for(let i=-w/2+1;i<w/2;i+=1.4) for(let j=-d/2+1;j<d/2;j+=1.4){
    const r = cyl(g, .02,.02,.7, 0x3c7a2f, x+i, .4, z+j, 4);
    r.castShadow = false;
  }
  box(g, w+.6, .3, .35, 0x7a6248, x, .15, z-d/2-.15);
  box(g, w+.6, .3, .35, 0x7a6248, x, .15, z+d/2+.15);
  box(g, .35, .3, d+.6, 0x7a6248, x-w/2-.15, .15, z);
  box(g, .35, .3, d+.6, 0x7a6248, x+w/2+.15, .15, z);
}

/* 竪穴住居 */
function pitHouse(g, x, z, s=1){
  cyl(g, 2.6*s, 2.9*s, .5, 0x8a7355, x, .25, z, 12);
  cone(g, 2.9*s, 3.2*s, 0xa08b52, x, 2.05*s, z, 10);
  cone(g, .4*s, .8*s, 0x6b5a3a, x, 3.7*s, z, 6);
}

/* 高床倉庫 */
function raisedStore(g, x, z){
  for(const [dx,dz] of [[-1.2,-1],[1.2,-1],[-1.2,1],[1.2,1]]) cyl(g,.15,.15,2.2,0x8a6b45,x+dx,undefined,z+dz,6);
  box(g, 3.4, 1.6, 2.6, 0xb59a67, x, 3.0, z);
  cone(g, 2.6, 1.6, 0x9c8449, x, 4.6, z, 4).rotation.y = Math.PI/4;
}

/* 寺院・五重塔 */
function pagoda(g, x, z, floors=5, s=1){
  let y = 0;
  for(let i=0;i<floors;i++){
    const w = (4.6 - i*0.6)*s;
    box(g, w, 1.5*s, w, 0xa03a2a, x, y+0.75*s, z);
    const roof = cone(g, w*0.95, 1.0*s, 0x3a3f4a, x, y+1.9*s, z, 4);
    roof.rotation.y = Math.PI/4;
    y += 2.1*s;
  }
  cyl(g, .1*s,.1*s, 2.2*s, 0xd0a93c, x, y+1.0*s, z, 6);
}
function templeHall(g, x, z, w=12, d=8, h=4, roofColor=0x3a3f4a){
  box(g, w, h, d, 0xb43b28, x, h/2+0.6, z);
  box(g, w+2, .6, d+2, 0x8a8f99, x, .3, z);
  const r = cone(g, Math.max(w,d)*0.78, h*0.8, roofColor, x, h+0.6+h*0.4, z, 4);
  r.rotation.y = Math.PI/4;
}

/* 城（天守） */
function castle(g, x, z, tiers=4){
  box(g, 16, 5, 16, 0x9a9484, x, 2.5, z);          // 石垣
  let y = 5, w = 11;
  for(let i=0;i<tiers;i++){
    box(g, w, 3, w, 0xf2efe6, x, y+1.5, z);
    const r = cone(g, w*0.8, 1.6, 0x3c4654, x, y+3.6, z, 4);
    r.rotation.y = Math.PI/4;
    y += 4.0; w -= 2.2;
  }
  cone(g, .3,.9, 0xd0a93c, x, y+0.8, z, 6);
}

/* 町屋の列 */
function townRow(g, x, z, n=5, ry=0){
  const row = new THREE.Group();
  for(let i=0;i<n;i++){
    box(row, 4, 3, 5, 0xcbb38a, i*4.4, 1.5, 0);
    const r = cone(row, 3.4, 1.5, 0x4a4f58, i*4.4, 3.7, 0, 4);
    r.rotation.y = Math.PI/4;
  }
  row.position.set(x, 0, z); row.rotation.y = ry;
  g.add(row);
}

/* 近代ビル */
function building(g, x, z, w, h, d, color=0x8fa3b5, lit=false){
  const b = box(g, w, h, d, color, x, h/2, z);
  if(lit){
    const winMat = new THREE.MeshBasicMaterial({ color:0xffe9a8 });
    for(let fy=2; fy<h-1; fy+=2.2) for(let fx=-w/2+1; fx<w/2-0.5; fx+=1.6){
      if(Math.random()<0.55){
        const win = new THREE.Mesh(new THREE.PlaneGeometry(.7,.9), winMat);
        win.position.set(x+fx, fy, z+d/2+.02); g.add(win);
      }
    }
  }
  return b;
}

/* 船 */
function boat(g, x, z, len=6, color=0x6b4a2e, sail=false){
  const b = new THREE.Group();
  box(b, len, 1, 2, color, 0, .8, 0);
  if(sail){ cyl(b,.07,.07,5,0x8a6b45,0,3.3,0,6); box(b, 3,3,.06, 0xf2ead5, 0, 3.6, 0.1); }
  b.position.set(x, 0, z); g.add(b);
  anim((t)=>{ b.position.y = Math.sin(t*1.2+x)*0.15; b.rotation.z = Math.sin(t*0.9+x)*0.03; });
  return b;
}

/* ============================================================
   生活ビネット: 3D字幕ラベル / 座る人 / 農作業 / 炊事 / 機織り / 屋台
============================================================ */
function label(g, text, x, y, z, s=1){
  const pad = 28, fs = 44;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  const font = `bold ${fs}px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif`;
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  c.width = Math.ceil(tw + pad*2); c.height = 80;
  ctx = c.getContext('2d');
  ctx.font = font;
  ctx.fillStyle = 'rgba(15,13,20,.88)';
  ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(232,184,75,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(2, 2, c.width-4, c.height-4, 18); ctx.stroke();
  ctx.fillStyle = '#f5efdf'; ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, c.height/2 + 2);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  const k = 0.036 * s;
  spr.scale.set(c.width * k, c.height * k, 1);
  spr.position.set(x, y, z);
  spr.renderOrder = 999;
  g.add(spr);
  return spr;
}

/* 座る人（正座） */
function sitter(g, clothColor, x, z, ry=0){
  const p = new THREE.Group();
  cyl(p, .45,.55, .95, clothColor, 0, .5, 0, 8);
  sph(p, .34, 0xe8c39e, 0, 1.22, 0);
  p.position.set(x, 0, z); p.rotation.y = ry; g.add(p);
  return p;
}

/* かがんで働く人（田植え・畑仕事） */
function bendWorker(g, clothColor, x, z, ry=0){
  const p = new THREE.Group();
  const body = cyl(p, .4,.5, 1.3, clothColor, 0, .95, 0, 8);
  body.rotation.x = .7;
  sph(p, .32, 0xe8c39e, 0, 1.35, .75);
  cone(p, .5,.28, 0xc9a86a, 0, 1.62, .75);
  p.position.set(x, 0, z); p.rotation.y = ry; g.add(p);
  anim((t)=>{ p.rotation.x = Math.sin(t*2 + x)*.12; });
  return p;
}

/* 炊事（火 + 鍋/土器 + 座る人） */
function cooking(g, x, z, potColor=0x8a5a3a){
  fire(g, x, z, .7);

/* 機織り */

  const l = new THREE.Group();
  box(l, .15, 1.6, .15, 0x8a6b45, -.8, .8, 0); box(l, .15, 1.6, .15, 0x8a6b45, .8, .8, 0);

============================================================ */
function baseTerrain(g, groundColor, opts={}){
  const ground = new THREE.Mesh(new THREE.CircleGeometry(240, 48), M(groundColor));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
  g.add(ground);
  // 遠景の山並み＋富士
  const mtn = [[-150,40,60],[ -90,28,45],[120,34,55],[170,26,42],[60,22,38]];
  for(const [mx,mh,mr] of mtn) cone(g, mr, mh, 0x4a5e52, mx, mh/2, -170, 7);
  cone(g, 46, 52, 0x5d6b78, 10, 26, -205, 24);         // 富士山
  cone(g, 18, 16, 0xf5f5fa, 10, 44, -205, 24);         // 冠雪

    const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 160), M(0x2e5d7d,{transparent:true,opacity:.92}));

    g.add(sea);
    anim((t)=>{ sea.position.y = .02 + Math.sin(t)*0.05; });
  }
}

function evYearLabel(y){
  if(y <= -1000) return `約${Math.round(-y/1000)*1000+2000}年前`;
  if(y < 0) return `前${-y}年`;
  return `${y}年`;
}
function renderTicker(eraId, year){
  const el = document.getElementById('ticker');
  const evs = (EVENTS[eraId] || []).filter(ev => ev[0] <= year).slice(-4);
  const html = evs.map(ev => `<div class="tick-line"><b>${evYearLabel(ev[0])}</b> ${ev[1]}</div>`).join('');
  if(el.dataset.h !== html){ el.innerHTML = html; el.dataset.h = html; }
}

    subLines = (ERAS_EN[e.id].summary.match(/[^.]+\./g) || [ERAS_EN[e.id].summary]).map(s => ['', s.trim()]);
  } else {
    const tags = { life:'【生活】', industry:'【産業】', war:'【戦い】', problem:'【課題と解決】' };
    subLines = ['life','industry','war','problem'].flatMap(k => (e.info[k]||[]).map(s => [tags[k], s]));
  }
  subIdx = 0;
  clearInterval(subTimer);
  const show = () => {
    subtitleEl.style.opacity = 0;
    setTimeout(() => {
      const [tag, text] = subLines[subIdx % subLines.length];
      subtitleEl.innerHTML = applyRuby((tag ? `<span class="tag">${tag}</span>` : '') + text);
      subtitleEl.style.opacity = 1;
      subIdx++;
    }, 400);
  };
  show();
  subTimer = setInterval(show, 6500);
}
/* 字幕バーを操作パネルの高さに合わせて配置 */
function placeSubtitle(){
  const c = document.getElementById('controls');
  subtitleEl.style.bottom = (c.offsetHeight + 26) + 'px';
}
addEventListener('resize', placeSubtitle);
setTimeout(placeSubtitle, 0);

/* 時間帯（昼・夕・夜） */
let todMode = 0, currentSky = ERAS[0].sky;
const todBtn = document.getElementById('todBtn');
function applyTimeOfDay(){
  const base = new THREE.Color(currentSky);
  if(todMode === 0){
    scene.background = base; scene.fog = new THREE.Fog(base, 150, 500);
    sun.intensity = 1.6; sun.color.set(0xfff2dd); hemi.intensity = .9;
  } else if(todMode === 1){
    const c = base.clone().lerp(new THREE.Color(0xff8a50), .45);
    scene.background = c; scene.fog = new THREE.Fog(c, 140, 480);
    sun.intensity = 1.1; sun.color.set(0xffb070); hemi.intensity = .55;
  } else {
    const c = base.clone().multiplyScalar(.22);
    scene.background = c; scene.fog = new THREE.Fog(c, 120, 450);
    sun.intensity = .25; sun.color.set(0x8899cc); hemi.intensity = .3;
  }
}
todBtn.onclick = () => {
  todMode = (todMode + 1) % 3;
  todBtn.textContent = ['☀️','🌆','🌙'][todMode];
  applyTimeOfDay();
};

/* ラベルの重なり解消: 画面上で重なる字幕はカメラに近いものだけ表示 */
let labelSprites = [], declutterT = 9;
const _dv1 = new THREE.Vector3(), _dv2 = new THREE.Vector3();
function declutterLabels(){
  if(!labelSprites.length) return;
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const items = [];
  for(const spr of labelSprites){
    spr.getWorldPosition(_dv1);
    const dist = _dv1.distanceTo(camera.position);
    _dv2.copy(_dv1).project(camera);
    if(_dv2.z > 1 || Math.abs(_dv2.x) > 1.2 || Math.abs(_dv2.y) > 1.2){ spr.visible = false; continue; }
    const hN = spr.scale.y / (dist * halfH);
    const wN = spr.scale.x / (dist * halfH * camera.aspect);
    items.push({ spr, dist, sx: _dv2.x, sy: _dv2.y, wN, hN });
  }
  items.sort((a, b) => a.dist - b.dist);
  const kept = [];
  for(const it of items){
    let ok = true;
    for(const k of kept){
      if(Math.abs(it.sx - k.sx) < (it.wN + k.wN) * .5 && Math.abs(it.sy - k.sy) < (it.hN + k.hN) * .55){ ok = false; break; }
    }
    it.spr.visible = ok;
    if(ok) kept.push(it);
  }
}
tourBtn.onclick = () => {
  touring = !touring;
  tourBtn.classList.toggle('active', touring);
  if(touring) collectPOIs();
};
renderer.domElement.addEventListener('pointerdown', () => {
  if(touring){ touring = false; tourBtn.classList.remove('active'); }
});

/* 環境音（Web Audioで手続き生成 — 外部音源不要）
   前近代: 風のノイズ＋鳥のさえずり（夜は虫の音） / 近代以降: 都市の低いハム＋汽笛風 */
const sndBtn = document.getElementById('sndBtn');
let audioOn = false, audioCtx = null, master = null, ambientSrc = null, ambientTimer = null;
function tone(freq0, freq1, dur, type='sine', vol=.12, delay=0){
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(freq1, 1), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + dur*.2);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(master);
  o.start(t0); o.stop(t0 + dur + .05);
}
const chirp   = () => { const n = 2 + Math.floor(Math.random()*3); for(let i=0;i<n;i++) tone(2400+Math.random()*800, 3200+Math.random()*800, .12, 'sine', .07, i*.15); };
const cricket = () => { for(let i=0;i<6;i++) tone(4200, 4400, .05, 'triangle', .045, i*.09); };
const horn    = () => tone(220, 170, .6, 'triangle', .04);
function rebuildAmbient(){
  if(!audioOn || !audioCtx) return;
  if(ambientSrc){ try{ ambientSrc.stop(); }catch(e){} ambientSrc = null; }
  clearInterval(ambientTimer);
  const len = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
  const filt = audioCtx.createBiquadFilter();
  const modern = currentEra >= 10;                 // 明治以降は都市音
  filt.type = 'bandpass';
  filt.frequency.value = modern ? 120 : 420;
  filt.Q.value = modern ? .8 : .4;
  const g = audioCtx.createGain(); g.gain.value = modern ? .5 : .28;
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start();
  ambientSrc = src;
  ambientTimer = setInterval(() => {
    if(!audioOn) return;
    if(!modern && todMode !== 2 && Math.random() < .6) chirp();
    if(!modern && todMode === 2 && Math.random() < .5) cricket();
    if(modern && Math.random() < .22) horn();
  }, 1800);
}
sndBtn.onclick = () => {
  audioOn = !audioOn;
  sndBtn.textContent = audioOn ? '🔊' : '🔇';
  if(audioOn){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain(); master.gain.value = .25; master.connect(audioCtx.destination);
    }
    audioCtx.resume();
    rebuildAmbient();
  } else {
    if(ambientSrc){ try{ ambientSrc.stop(); }catch(e){} ambientSrc = null; }
    clearInterval(ambientTimer);
    if(audioCtx) audioCtx.suspend();
  }
};

/* ふりがなモード（子ども向け・日本語のみ） */
let rubyOn = false;
const RUBY = {
  '竪穴住居':'たてあなじゅうきょ','貝塚':'かいづか','縄文海進':'じょうもんかいしん','環濠集落':'かんごうしゅうらく',
  '高床倉庫':'たかゆかそうこ','卑弥呼':'ひみこ','前方後円墳':'ぜんぽうこうえんふん','埴輪':'はにわ','須恵器':'すえき',
  '渡来人':'とらいじん','冠位十二階':'かんいじゅうにかい','遣隋使':'けんずいし','遣唐使':'けんとうし',
  '大宝律令':'たいほうりつりょう','漏刻':'ろうこく','墾田永年私財法':'こんでんえいねんしざいほう','万葉集':'まんようしゅう',
  '摂関政治':'せっかんせいじ','御霊会':'ごりょうえ','寝殿造':'しんでんづくり','徳政令':'とくせいれい','惣村':'そうそん',
  '書院造':'しょいんづくり','下剋上':'げこくじょう','勘合貿易':'かんごうぼうえき','楽市楽座':'らくいちらくざ',
  '太閤検地':'たいこうけんち','刀狩':'かたながり','参勤交代':'さんきんこうたい','寺子屋':'てらこや','浮世絵':'うきよえ',
  '瓦版':'かわらばん','勧進相撲':'かんじんずもう','殖産興業':'しょくさんこうぎょう','廃仏毀釈':'はいぶつきしゃく',
  '文明開化':'ぶんめいかいか','財閥':'ざいばつ'
};
const RUBY_SORTED = Object.entries(RUBY).sort((a,b) => b[0].length - a[0].length);
function applyRuby(html){
  if(!rubyOn || lang === 'en') return html;
  for(const [k, r] of RUBY_SORTED){
    html = html.split(`<ruby>${k}`).join(`␀${k}`);   // 既にルビ化済みを保護
    html = html.split(k).join(`<ruby>${k}<rt>${r}</rt></ruby>`);
  }
  return html;
}
const rubyBtn = document.getElementById('rubyBtn');
rubyBtn.onclick = () => {
  rubyOn = !rubyOn;
  rubyBtn.classList.toggle('active', rubyOn);
  const e = ERAS[currentEra];
  renderPanel(e);
  startSubtitles(e);
};

ERAS.forEach((e, i) => {
  const b = document.createElement('button');
  b.textContent = e.name.replace('（戦国含む）','');
  b.onclick = () => { slider.value = i*SEG; onSlider(); };
  eraButtonsDiv.appendChild(b);
});

function yearLabel(y){
  if(lang === 'en'){
    if(y <= -1000) return `~${Math.round(-y/1000)*1000+2000} years ago`;
    if(y < 0) return `${-y} BCE`;
    return `${y} CE`;
  }
  if(y <= -1000) return `約${Math.round(-y/1000)*1000+2000}年前`;
  if(y < 0) return `紀元前${-y}年`;
  return `西暦${y}年`;
}

function setEra(i){
  if(i === currentEra) return;
  currentEra = i;
  const e = ERAS[i];
  fade.style.opacity = 1;
  setTimeout(() => {
    if(eraGroup){
      scene.remove(eraGroup);
      eraGroup.traverse(o => { if(o.geometry) o.geometry.dispose(); });
    }
    animated = [];
    eraGroup = new THREE.Group();
    e.build(eraGroup);
    scene.add(eraGroup);
    currentSky = e.sky;
    applyTimeOfDay();
    collectPOIs();
    if(audioOn) rebuildAmbient();
    bannerName.textContent = lang === 'en' ? ERAS_EN[e.id].name : e.name;
    bannerYears.textContent = lang === 'en' ? ERAS_EN[e.id].years : e.years;
    renderPanel(e);
    [...eraButtonsDiv.children].forEach((b,bi)=>b.classList.toggle('active', bi===i));
    startSubtitles(e);
    fade.style.opacity = 0;
  }, 360);
}

function onSlider(){
  const v = +slider.value;
  const i = Math.min(ERAS.length-1, Math.floor(v/SEG));
  const frac = (v - i*SEG) / SEG;
  const e = ERAS[i];
  const year = Math.round(e.y0 + (e.y1 - e.y0) * frac);
  bannerNow.textContent = yearLabel(year);
  renderTicker(e.id, year);
  setEra(i);
}
slider.addEventListener('input', onSlider);

playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playLabel();
};

const infoToggle = document.getElementById('infoToggle');
if(innerWidth < 760){
  infoPanel.style.display = 'none';
  infoToggle.style.display = 'block';
  infoToggle.onclick = () => {
    const show = infoPanel.style.display === 'none';
    infoPanel.style.display = show ? 'block' : 'none';
    infoToggle.textContent = show ? '解説を隠す' : '解説を表示';
  };
}

/* ============================================================
   メインループ
============================================================ */
const clock = new THREE.Clock();
let acc = 0;
/* 再生の時間進行はrAFと独立（タブが非表示でも進む） */
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTick) / 1000, 1.5);
  lastTick = now;
  if(!playing) return;
  acc += dt * 6 * (+speedSel.value);   // 約16秒で1時代（1×）
  if(acc >= 1){
    const step = Math.floor(acc); acc -= step;
    let v = +slider.value + step;
    if(v > +slider.max){ v = +slider.max; playing = false; playBtn.textContent = playLabel(); }
    slider.value = v; onSlider();
  }
}, 100);
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .1);
  const t = clock.elapsedTime;
  if(touring && tourPOIs.length){
    tourTimer += dt;
    if(tourTimer > 6){ tourTimer = 0; tourIdx = (tourIdx + 1) % tourPOIs.length; }
    const poi = tourPOIs[tourIdx];
    const tgt = new THREE.Vector3(poi.x, Math.max(poi.y - 2, 1.5), poi.z);
    const dir = new THREE.Vector3(poi.x, 0, poi.z);
    if(dir.lengthSq() < 1) dir.set(1, 0, 1);
    dir.normalize();
    const camPos = new THREE.Vector3(poi.x + dir.x*16, tgt.y + 9, poi.z + dir.z*16);
    controls.target.lerp(tgt, Math.min(dt*2, 1));
    camera.position.lerp(camPos, Math.min(dt*1.5, 1));
  }
  declutterT += dt;
  if(declutterT > .25){ declutterT = 0; declutterLabels(); }
  for(const fn of animated) fn(t, dt);
  controls.update();
  renderer.render(scene, camera);
}

setEra(0);
onSlider();
loop();
document.getElementById('loading').style.display = 'none';
</script>
